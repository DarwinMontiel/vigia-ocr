[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vigia-ocr"
version = "1.0.0"
description = "Bot RPA que consulta un portal público, lee por OCR el estado que el portal publica como imagen y lo guarda en SQL Server con idempotencia, verificación y circuit breaker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Darwin Montiel Mora", email = "darwinmontielm@gmail.com" }]
keywords = ["rpa", "ocr", "selenium", "tesseract", "ddddocr", "easyocr", "sql-server", "hexagonal"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Spanish",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=10.3,<14",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "selenium>=4.20,<5",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.1",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Motores livianos: ddddocr (ONNX) y Tesseract (requiere el binario del sistema).
ocr = ["ddddocr>=1.5", "pytesseract>=0.3.10"]
# Motor pesado: EasyOCR trae PyTorch (~1 GB). Solo para el banco de evaluación completo.
easyocr = ["easyocr>=1.7"]
# Conexión a SQL Server (requiere ODBC Driver 18 for SQL Server).
sqlserver = ["pyodbc>=5.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
vigia = "vigia_ocr.cli:app"

[project.urls]
Repositorio = "https://github.com/DarwinMontiel/vigia-ocr"
Demo = "https://darwinmontiel.github.io/vigia-ocr/"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e and not ocr and not sqlserver'"
markers = [
    "ocr: usa motores OCR reales (pip install -e '.[ocr]' y el binario de Tesseract)",
    "e2e: bot real con Selenium y Chrome contra el portal ficticio",
    "sqlserver: requiere un SQL Server real (docker compose up -d sqlserver)",
]
filterwarnings = [
    "ignore::DeprecationWarning:onnxruntime.*",
    # FastAPI aún importa el TestClient de Starlette sobre httpx; no afecta a las pruebas.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["vigia_ocr"]
omit = [
    "*/adaptadores/ocr/easyocr_motor.py",
    "*/adaptadores/ocr/ddddocr_motor.py",
    "*/adaptadores/ocr/tesseract_motor.py",
    "*/adaptadores/portal/selenium_portal.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PT", "PL", "C4", "PTH", "RET"]
# PLC0415: los imports perezosos son deliberados (motores y dependencias pesadas opcionales).
# N818: las excepciones siguen la convención en español (ErrorVigia, PortalNoDisponible...).
ignore = [
    "S101", "B008", "RUF001", "RUF002", "RUF003",
    "PLR0913", "PLR2004", "PLR0911", "PLC0415", "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PLR0915"]
"src/vigia_ocr/sintetico/**" = ["S311"]
"src/vigia_ocr/portal_ficticio/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ddddocr.*", "easyocr.*", "pytesseract.*", "pyodbc.*"]
ignore_missing_imports = true
