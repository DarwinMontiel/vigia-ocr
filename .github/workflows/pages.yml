# Publica la demo estática: lecturas reales de la cadena OCR + resultados del banco de evaluación.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["src/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install ".[ocr]"
      - name: Construir sitio
        run: |
          vigia demo-web --salida site --cantidad 12 --motores ddddocr,tesseract --evaluacion docs/evaluacion.json
          mkdir -p site/imagenes && cp docs/imagenes/* site/imagenes/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
